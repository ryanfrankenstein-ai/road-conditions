name: Update road reports

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roads
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Iowa 511 reports
        run: node fetch-roads.mjs
      - name: Save roads.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roads.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update road reports"
            git push
          fi
